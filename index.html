<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bank DApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <style>
    :root {
      --bg: #f4f6fb; --card: #ffffff; --text: #1d2433; --muted: #667085;
      --line: #e3e7ef; --accent: #3b5bdb; --accent-ink: #ffffff;
      --ok: #1f8a4c; --err: #c92a2a; --soft: #eef2ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Prompt", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .student { color: var(--muted); font-size: .95rem; }
    .student b { color: var(--text); font-weight: 600; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 20px; margin-bottom: 16px;
    }
    .card h2 { margin: 0 0 12px; font-size: 1.05rem; }
    label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line);
      border-radius: 10px; background: var(--card); color: var(--text);
    }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button {
      flex: 1; min-width: 120px; padding: 10px 14px; font: inherit; font-weight: 500;
      border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
      cursor: pointer;
    }
    button.secondary { background: var(--soft); color: var(--accent); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .info { font-size: .9rem; word-break: break-all; margin-top: 8px; }
    .balance { font-size: 2rem; font-weight: 600; margin: 4px 0; }
    #status { font-size: .9rem; min-height: 1.4em; margin-top: 4px; }
    #status.ok { color: var(--ok); } #status.err { color: var(--err); }
    footer { text-align: center; color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🏦 Bank DApp</h1>
      <div class="student">
        รหัสนักศึกษา <b id="sid"></b> · ชื่อ-สกุล <b id="sname"></b>
      </div>
    </header>

    <section class="card">
      <h2>1. เชื่อมต่อ MetaMask</h2>
      <button id="btnConnect">Connect MetaMask</button>
      <div class="info" id="account">ยังไม่ได้เชื่อมต่อ</div>
      <div class="info" id="network"></div>
    </section>

    <section class="card">
      <h2>2. เชื่อมต่อ Smart Contract</h2>
      <label for="contractAddr">Contract Address</label>
      <input id="contractAddr" placeholder="0x..." />
      <div class="row">
        <button id="btnContract" class="secondary" disabled>Connect Contract</button>
      </div>
      <div class="info" id="contractInfo"></div>
    </section>

    <section class="card">
      <h2>3. ยอดเงินของฉัน</h2>
      <div class="balance"><span id="balance">-</span> ETH</div>
      <button id="btnBalance" class="secondary" disabled>Check Balance</button>
    </section>

    <section class="card">
      <h2>4. ฝาก / ถอน</h2>
      <label for="amount">จำนวน (ETH)</label>
      <input id="amount" type="number" min="0" step="0.0001" placeholder="เช่น 0.01" />
      <div class="row">
        <button id="btnDeposit" disabled>Deposit</button>
        <button id="btnWithdraw" disabled>Withdraw</button>
      </div>
      <div id="status"></div>
    </section>

    <footer>Smart Contract Bank · ethers.js v6 · MetaMask</footer>
  </div>

  <script>
    // ===== แก้ข้อมูลตรงนี้ =====
    const STUDENT_ID = "66031036";
    const STUDENT_NAME = "ธนภัทร หนูบุญมี";
    const CONTRACT_ADDRESS = "0xd48cd2cd47787243C1e564325aaf88330b03a51d"; // Hoodi

    // Network: Ethereum Hoodi testnet
    const HOODI = {
      chainId: "0x88bb0", // 560048
      chainName: "Ethereum Hoodi",
      nativeCurrency: { name: "Hoodi ETH", symbol: "ETH", decimals: 18 },
      rpcUrls: ["https://ethereum-hoodi-rpc.publicnode.com"],
      blockExplorerUrls: ["https://hoodi.etherscan.io"]
    };

    // ABI ของ Bank.sol
    const ABI = [
      "function deposit() payable",
      "function withdraw(uint256 amount)",
      "function checkBalance() view returns (uint256)",
      "event Deposited(address indexed account, uint256 amount)",
      "event Withdrawn(address indexed account, uint256 amount)"
    ];
    // ==========================

    const $ = (id) => document.getElementById(id);
    $("sid").textContent = STUDENT_ID;
    $("sname").textContent = STUDENT_NAME;
    $("contractAddr").value = CONTRACT_ADDRESS;

    let provider, signer, contract;

    function setStatus(msg, type = "") {
      const el = $("status");
      el.textContent = msg;
      el.className = type;
    }

    function errMsg(e) {
      return e?.shortMessage || e?.info?.error?.message || e?.reason || e?.message || String(e);
    }

    async function connectWallet() {
      if (!window.ethereum) {
        alert("ไม่พบ MetaMask กรุณาติดตั้ง MetaMask extension ก่อน");
        return;
      }
      try {
        await window.ethereum.request({ method: "eth_requestAccounts" });
        await ensureHoodi();
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        const addr = await signer.getAddress();
        const net = await provider.getNetwork();
        $("account").textContent = "Account: " + addr;
        $("network").textContent = "Network: " + (net.chainId === 560048n ? "Ethereum Hoodi" : net.name) + " (chainId " + net.chainId + ")";
        $("btnConnect").textContent = "Connected ✓";
        $("btnContract").disabled = false;
        if ($("contractAddr").value.trim()) await connectContract();
      } catch (e) {
        alert("เชื่อมต่อไม่สำเร็จ: " + errMsg(e));
      }
    }

    async function ensureHoodi() {
      const current = await window.ethereum.request({ method: "eth_chainId" });
      if (current.toLowerCase() === HOODI.chainId) return;
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: HOODI.chainId }]
        });
      } catch (e) {
        if (e.code === 4902 || e?.data?.originalError?.code === 4902) {
          await window.ethereum.request({ method: "wallet_addEthereumChain", params: [HOODI] });
        } else {
          throw e;
        }
      }
    }

    async function connectContract() {
      const addr = $("contractAddr").value.trim();
      if (!ethers.isAddress(addr)) { $("contractInfo").textContent = "Address ไม่ถูกต้อง"; return; }
      const code = await provider.getCode(addr);
      if (code === "0x") {
        $("contractInfo").textContent = "ไม่พบ contract ที่ address นี้บน Hoodi";
        return;
      }
      contract = new ethers.Contract(addr, ABI, signer);
      $("contractInfo").textContent = "Connected contract: " + addr;
      ["btnBalance", "btnDeposit", "btnWithdraw"].forEach((id) => ($(id).disabled = false));
      await checkBalance();
    }

    async function checkBalance() {
      try {
        const bal = await contract.checkBalance();
        $("balance").textContent = ethers.formatEther(bal);
      } catch (e) {
        setStatus("อ่านยอดเงินไม่สำเร็จ: " + errMsg(e), "err");
      }
    }

    function readAmount() {
      const v = $("amount").value.trim();
      if (!v || Number(v) <= 0) throw new Error("กรุณากรอกจำนวนเงินมากกว่า 0");
      return ethers.parseEther(v);
    }

    async function sendTx(kind) {
      try {
        const wei = readAmount();
        setStatus("กรุณายืนยันใน MetaMask...");
        const tx = kind === "deposit"
          ? await contract.deposit({ value: wei })
          : await contract.withdraw(wei);
        setStatus("รอยืนยันธุรกรรม... " + tx.hash);
        await tx.wait();
        setStatus((kind === "deposit" ? "ฝาก" : "ถอน") + "สำเร็จ ✓", "ok");
        $("amount").value = "";
        await checkBalance();
      } catch (e) {
        setStatus("ไม่สำเร็จ: " + errMsg(e), "err");
      }
    }

    $("btnConnect").onclick = connectWallet;
    $("btnContract").onclick = connectContract;
    $("btnBalance").onclick = checkBalance;
    $("btnDeposit").onclick = () => sendTx("deposit");
    $("btnWithdraw").onclick = () => sendTx("withdraw");

    if (window.ethereum) {
      window.ethereum.on?.("accountsChanged", () => location.reload());
      window.ethereum.on?.("chainChanged", () => location.reload());
    }
  </script>
</body>
</html>
